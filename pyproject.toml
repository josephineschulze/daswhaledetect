[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daswhaledetect"
version = "0.1.0"
description = "DAS preprocessing pipeline (channel averaging, resampling, filtering, windowing)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]