[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daswhaledetect"
version = "0.1.0"
description = "DAS whale-call detection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "h5py",
    "joblib",
    "PyYAML",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daswhaledetect*"]